
services:
  # Backend Laravel Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: learnova-backend
    ports:
      - "8000:80"
    env_file:
      - ./server/.env
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    volumes:
      - ./server:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - /var/www/html/bootstrap/cache
    networks:
      - learnova-network

  # Frontend Vite Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: learnova-frontend
    ports:
      - "3000:80"
    env_file:
      - ./client/.env
    networks:
      - learnova-network

networks:
  learnova-network:
    driver: bridge
